name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to create tags and releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        run: |
          VN=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VC=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "Version: $VN (code $VC)"

      - name: Lint, test, build
        run: ./gradlew :app:lint testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "link-resolver-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: link-resolver-${{ env.VERSION_NAME }}
          path: link-resolver-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # Every push to main (and any v* tag you push) becomes a GitHub Release with the APK attached.
      - name: Release tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION_NAME}"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Link Resolver ${{ env.VERSION_NAME }}
          files: link-resolver-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          make_latest: true
